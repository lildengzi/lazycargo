[package]
name = "lazycargo-tui"
version.workspace = true
edition.workspace = true
description = "A project-focused Cargo management TUI."
license.workspace = true
readme = "../README.md"
repository = "https://github.com/lildengzi/lazycargo"
homepage = "https://github.com/lildengzi/lazycargo"
keywords = ["cargo", "tui", "rust", "workspace"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "lazycargo"
path = "src/lib.rs"

[dependencies]
ansi-to-tui = "8.0"
arboard = "3.4"
base64.workspace = true
cargo_metadata = "0.19"
chrono.workspace = true
crossterm.workspace = true
dirs.workspace = true
lazycargo_search = { path = "../lazycargo_search", version = "0.2.0" }
open = "5.3"
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true

[[bin]]
name = "lazycargo"
path = "src/main.rs"

[package.metadata.deb]
name = "lazycargo"
maintainer = "lildengzi"
copyright = "2026, lildengzi"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/lazycargo", "usr/bin/lazycargo", "755"],
    ["../README.md", "usr/share/doc/lazycargo/README.md", "644"],
    ["../LICENSE", "usr/share/doc/lazycargo/LICENSE", "644"],
]

[package.metadata.generate-rpm]
name = "lazycargo"
license = "MIT"
summary = "A lazygit-style Cargo workspace TUI for Rust projects."
assets = [
    { source = "../target/release/lazycargo", dest = "/usr/bin/lazycargo", mode = "755" },
    { source = "../README.md", dest = "/usr/share/doc/lazycargo/README.md", mode = "644" },
    { source = "../LICENSE", dest = "/usr/share/doc/lazycargo/LICENSE", mode = "644" },
]
