name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run instead of uploading"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish workspace crates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo build --workspace --release

      - name: Check crates.io token
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"

      - name: Dry-run publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          cargo publish -p lazycargo_search --dry-run
          if cargo search lazycargo_search --limit 5 | grep -q '^lazycargo_search ='; then
            cargo publish -p lazycargo-tui --dry-run
          else
            echo "Skipping lazycargo-tui dry-run until lazycargo_search exists on crates.io."
            echo "After lazycargo_search is published once, lazycargo-tui dry-run will work normally."
          fi

      - name: Publish lazycargo_search
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p lazycargo_search

      - name: Wait for lazycargo_search index
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          for attempt in $(seq 1 30); do
            if cargo search lazycargo_search --limit 5 | grep -q '^lazycargo_search ='; then
              echo "lazycargo_search is visible in crates.io index."
              exit 0
            fi
            echo "Waiting for crates.io index propagation (${attempt}/30)..."
            sleep 10
          done
          echo "lazycargo_search did not appear in crates.io index in time."
          exit 1

      - name: Publish lazycargo-tui
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p lazycargo-tui
