name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check:
    name: fmt, clippy, test, release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Release build
        run: cargo build --workspace --release

  release-build:
    name: release build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: lazycargo-linux-x86_64
            binary_path: target/release/lazycargo
          - os: macos-latest
            artifact_name: lazycargo-macos-aarch64
            binary_path: target/release/lazycargo
          - os: windows-latest
            artifact_name: lazycargo-windows-msvc-x86_64.exe
            binary_path: target/release/lazycargo.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --workspace --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

  github-release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Normalize artifact names
        shell: bash
        run: |
          mkdir -p release
          cp dist/lazycargo-linux-x86_64/lazycargo release/lazycargo-linux-x86_64
          cp dist/lazycargo-macos-aarch64/lazycargo release/lazycargo-macos-aarch64
          cp dist/lazycargo-windows-msvc-x86_64.exe/lazycargo.exe release/lazycargo-windows-msvc-x86_64.exe
          chmod +x release/lazycargo-linux-x86_64 release/lazycargo-macos-aarch64
          sha256sum release/* > release/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
